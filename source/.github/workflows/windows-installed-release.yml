name: Windows existing installer qualification
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release containing existing native installers and candidate-installers.json
        required: true
        type: string
      source_commit:
        description: Exact product source commit from the native build provenance
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download candidates without executing them
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir candidates
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-Windows-*-Setup.exe' --pattern 'candidate-installers.json' --dir candidates
      - uses: actions/upload-artifact@v4
        with:
          name: existing-installers
          path: candidates/
          retention-days: 3
  qualify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: existing-installers
          path: ${{ runner.temp }}/candidates
      - name: Verify exact existing installer identity
        shell: pwsh
        env:
          PRODUCT_SOURCE: ${{ inputs.source_commit }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:PRODUCT_SOURCE -notmatch '^[0-9a-f]{40}$'){throw 'Invalid product source revision'}
          $dir=Join-Path $env:RUNNER_TEMP 'candidates'
          $manifest=Get-Content (Join-Path $dir 'candidate-installers.json') -Raw | ConvertFrom-Json
          $entry=@($manifest | Where-Object {$_.arch -eq $env:TARGET_ARCH})
          if($entry.Count -ne 1 -or $entry[0].sourceCommit -ne $env:PRODUCT_SOURCE){throw 'Product source mismatch'}
          $e=$entry[0]
          if($e.file -notmatch '^FlexHMI-[0-9.]+-Windows-(x64|arm64)-Setup[.]exe$'){throw 'Unexpected installer name'}
          $file=Join-Path $dir $e.file
          if((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $e.sha256 -or (Get-Item $file).Length -ne $e.bytes){throw 'Existing installer integrity mismatch'}
          $artifacts=Join-Path $env:RUNNER_TEMP 'evidence';New-Item -ItemType Directory -Force $artifacts | Out-Null
          @{sourceCommit=$e.sourceCommit;qualificationCommit=$env:GITHUB_SHA;file=$e.file;sha256=$e.sha256;bytes=$e.bytes;buildRun=$e.buildRun} | ConvertTo-Json | Set-Content (Join-Path $artifacts 'candidate-identity.json') -Encoding UTF8
          "FLEX_INSTALLER=$file" >> $env:GITHUB_ENV
      - name: Qualify installed product through completed uninstall
        shell: pwsh
        run: ./scripts/windows/verify-installed.ps1 -Installer $env:FLEX_INSTALLER -Arch '${{ matrix.arch }}' -Artifacts '${{ runner.temp }}/evidence'
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 30
