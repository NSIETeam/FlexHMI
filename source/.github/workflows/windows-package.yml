name: Windows package acceptance
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft or published release containing candidate installers
        required: true
        default: v0.3.0-ipc-preview
        type: string
      rebuild_installer:
        description: Rebuild the wrapper with matching Windows NSIS tools; preserve candidate payload
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub exposes draft releases only with push access. Keep that token in
    # this download-only job; installer execution receives read permissions.
    permissions:
      contents: write
    steps:
      - name: Download draft candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir candidate
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-Windows-*-Setup.exe' --pattern '*IPC-build.json' --dir candidate
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-installers
          path: candidate/
          retention-days: 3
          if-no-files-found: error
  installed-package:
    needs: prepare-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-installers
          path: ${{ runner.temp }}/flex-candidate
      - name: Verify candidate
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'flex-candidate'
          $manifest = Get-Content (Join-Path $dir 'FlexHMI-0.3.0-IPC-build.json') -Raw | ConvertFrom-Json
          $entry = $manifest | Where-Object {$_.arch -eq $env:TARGET_ARCH}
          $installer=Join-Path $dir $entry.file
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256){throw 'Installer SHA256 differs from release manifest'}
          "FLEX_INSTALLER=$installer" >> $env:GITHUB_ENV
      - name: Rebuild wrapper with matching Windows tools
        if: inputs.rebuild_installer
        shell: pwsh
        run: ./scripts/windows/rebuild-installer.ps1 -Installer $env:FLEX_INSTALLER -Arch '${{ matrix.arch }}' -Output '${{ runner.temp }}/flex-evidence/FlexHMI-0.3.0-IPC-Windows-${{ matrix.arch }}-WindowsBuilt-Setup.exe'
      - name: Install and exercise shipped package
        shell: pwsh
        run: ./scripts/windows/verify-installed.ps1 -Installer $env:FLEX_INSTALLER -Arch '${{ matrix.arch }}' -Artifacts '${{ runner.temp }}/flex-evidence'
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-${{ matrix.arch }}
          path: ${{ runner.temp }}/flex-evidence/
          if-no-files-found: warn
          retention-days: 14
